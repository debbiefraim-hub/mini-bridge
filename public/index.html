<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מיני ברידג׳ - דבי אופקים</title><style>
:root{font-family:Arial,sans-serif;color:#f5f7f9;background:#102c26}*{box-sizing:border-box}html,body{overscroll-behavior-y:none}body{margin:0;padding:16px}main{max-width:950px;margin:auto}h1{text-align:center;font-size:clamp(24px,5vw,36px)}.panel{background:#1b4338;border:1px solid #547c6c;border-radius:16px;padding:16px;margin:12px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #9fb8aa;min-height:44px}input{background:#fff;color:#152c24;max-width:100%}button{background:#f6d47a;color:#18251c;cursor:pointer;font-weight:bold}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#d8e5de}.muted{color:#c6d6cd}.error{color:#ffb9aa;min-height:20px}.cards{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.card{display:inline-flex;align-items:center;justify-content:center;flex-direction:column;width:69px;height:99px;border-radius:9px;background:#fff;color:#161c1a;border:2px solid #ddd;font-weight:bold;font-size:22px;line-height:1.02;padding:3px 1px;gap:0;flex-shrink:0}.card .rank{display:block;font-size:34px;font-weight:900;line-height:1.08}.card .suit{display:block;font-size:43px;font-weight:900;line-height:1}.card.red{color:#bf2636}.trump-symbol{font-size:27px;font-weight:900;vertical-align:middle}.trump-symbol.red{color:#ff5665}.trump-symbol.black{color:#fff}.card.small{width:58px;height:85px;font-size:19px}.card.small .rank{font-size:30px}.card.small .suit{font-size:38px}.card:disabled{opacity:.6}.table{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto auto auto;gap:10px;align-items:center;text-align:center;min-height:250px}.seat{border:1px solid #638a77;border-radius:12px;padding:12px;min-width:0;width:100%;overflow:hidden}.seat b{display:block;font-size:clamp(16px,2.5vw,21px);line-height:1.25;overflow-wrap:anywhere}.seat .player-detail{display:block;font-size:clamp(14px,2vw,17px);line-height:1.4}.seat .player-stats{display:flex;justify-content:center;align-items:center;gap:8px;white-space:nowrap;font-size:clamp(16px,2.2vw,20px);font-weight:700;line-height:1.4}.seat.active{outline:3px solid #f6d47a}.seat.top{grid-column:2;grid-row:1}.seat.left{grid-column:1;grid-row:2}.seat.right{grid-column:3;grid-row:2}.seat.bottom{grid-column:2;grid-row:3}.center{grid-column:2;grid-row:2;display:flex;gap:7px;justify-content:center;align-items:center;flex-wrap:wrap}.center>div{font-size:16px;font-weight:700;line-height:1.3;overflow-wrap:anywhere;min-width:0}.center>div>small{font-size:inherit;font-weight:inherit}.badge{background:#315e4e;border-radius:20px;padding:5px 10px;display:inline-block;margin:3px}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #5b8070;text-align:right}@media(max-width:500px){.seat{padding:9px 5px;font-size:15px}.seat.left,.seat.right{width:calc(100% + 22px);max-width:calc(100vw - 42px)}.seat.left{justify-self:start;transform:translateX(9px)}.seat.right{justify-self:end;transform:translateX(-9px)}.seat.top,.seat.bottom{width:calc(100% + 38px);justify-self:center}.seat b{font-size:clamp(14px,3.7vw,18px)}.seat .player-detail{font-size:clamp(12px,3.3vw,16px)}.seat .player-stats{gap:3px;font-size:clamp(12px,3.1vw,16px);letter-spacing:-.4px}.seat .player-stats strong{font-size:1.2em;font-weight:900}.seat .player-stats{max-width:100%;flex-wrap:wrap;row-gap:0}.table{gap:4px}.card{width:55px;height:81px;font-size:18px}.card .rank{font-size:28px}.card .suit{font-size:36px}.center{gap:5px}.center>div{font-size:clamp(13px,3.5vw,16px)}.card.small{width:46px;height:68px;font-size:16px}.card.small .rank{font-size:23px}.card.small .suit{font-size:29px}} 
/* Layout: each player's played card stays with that player; round/trump in center */
.table{grid-template-columns:minmax(0,1fr) minmax(92px,.68fr) minmax(0,1fr);gap:8px;align-items:center}
.seat{padding:9px 5px;min-width:0;overflow:visible;display:flex;flex-direction:column;align-items:center;gap:5px}
.seat.top,.seat.bottom,.seat.left,.seat.right{width:100%;max-width:none;transform:none;justify-self:stretch}
.seat b{font-size:clamp(15px,2.7vw,22px);overflow-wrap:anywhere}
.seat-card{min-height:100px;display:flex;align-items:center;justify-content:center;width:100%}
.seat-card .card{width:70px;height:100px}
.seat-card .card .rank{font-size:36px}.seat-card .card .suit{font-size:46px}
.empty-card{font-size:12px;color:#c6d6cd}
.seat-info{width:100%}
.seat .player-stats{display:flex;flex-wrap:wrap;gap:3px 8px;white-space:normal;font-size:clamp(13px,1.8vw,19px)}
.seat .player-stats span{white-space:nowrap}.seat .player-stats strong{font-size:1.2em}
.center{display:flex;flex-direction:column;gap:8px;min-width:0}
.center #round,.center #trump{display:block;background:#315e4e;border-radius:12px;padding:8px 3px;font-weight:bold;font-size:clamp(15px,2.5vw,22px);width:100%;line-height:1.4}
.center .trump-symbol{font-size:30px}
@media(max-width:500px){
.table{grid-template-columns:minmax(0,1fr) minmax(82px,.8fr) minmax(0,1fr);gap:5px}
.seat{padding:7px 2px;gap:4px}
.seat.top,.seat.bottom,.seat.left,.seat.right{width:100%;max-width:none;transform:none}
.seat b{font-size:clamp(13px,3.6vw,18px)}
.seat-card{min-height:84px}.seat-card .card{width:58px;height:83px}.seat-card .card .rank{font-size:30px}.seat-card .card .suit{font-size:38px}
.seat .player-stats{font-size:clamp(11px,2.7vw,15px);gap:1px 5px;letter-spacing:0;line-height:1.25}
.seat .player-detail{font-size:clamp(11px,2.7vw,14px)}
.center #round,.center #trump{font-size:clamp(13px,3.2vw,17px);padding:7px 2px}
}

/* Equal visual width for upper/lower player panels; allow sideways overhang */
.seat.top,.seat.bottom{width:calc(100% + 58px);max-width:none;justify-self:center;overflow:visible}
.seat.top .player-stats,.seat.bottom .player-stats{flex-wrap:nowrap;white-space:nowrap}
@media(max-width:500px){
.seat.top,.seat.bottom{width:calc(100% + 48px);max-width:none;justify-self:center}
.seat.top .player-stats,.seat.bottom .player-stats{flex-wrap:nowrap;white-space:nowrap;font-size:clamp(11px,2.7vw,15px)}
}
</style></head><body><main><h1 id="gameTitle">♠ מיני ברידג' - דבי אופקים ♥</h1><section id="entry" class="panel"><p>משחק פרטי לארבעה משתתפים — כל אחד מהמכשיר שלו.</p><div class="row"><input id="name" placeholder="השם שלך" maxlength="24"><input id="room" placeholder="קוד חדר (להצטרפות)" maxlength="5"><button id="create">פתח חדר חדש</button><button id="join" class="secondary">הצטרף לחדר</button></div><p class="muted">לאחר רענון המשחק ינסה להתחבר אוטומטית. אם צריך, השתמש באותו מכשיר ובאותו שם וקוד חדר.</p></section><section id="game" hidden><div class="panel"><div class="row"><b>חדר: <span id="code"></span></b></div><p id="status" aria-live="polite"></p><div id="lobby"></div></div><div class="panel"><div class="table"><div class="seat top" id="seat2"></div><div class="seat left" id="seat1"></div><div class="center" id="played"><span id="round"></span><span id="trump"></span></div><div class="seat right" id="seat3"></div><div class="seat bottom" id="seat0"></div></div></div><div class="panel"><div id="actions"></div><h3>הקלפים שלך</h3><div class="cards" id="hand"></div></div><div class="panel"><h3>טבלת ניקוד</h3><div id="scores"></div></div></section><p id="error" class="error" role="alert"></p></main><script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id),socket=io();let state=null,identity=null;const storeKey='miniBridgeIdentityV2';try{identity=JSON.parse(localStorage.getItem(storeKey)||sessionStorage.getItem(storeKey)||'null');}catch(e){identity=null;}function saveIdentity(){try{if(identity){localStorage.setItem(storeKey,JSON.stringify(identity));sessionStorage.setItem(storeKey,JSON.stringify(identity));}else{localStorage.removeItem(storeKey);sessionStorage.removeItem(storeKey);}}catch(e){}}const red=s=>s==='♥'||s==='♦';const cardText=c=>(c.r<=10?c.r:{11:'J',12:'Q',13:'K',14:'A'}[c.r])+c.s;const cardFace=c=>`<span class="rank">${c.r<=10?c.r:{11:'J',12:'Q',13:'K',14:'A'}[c.r]}</span><span class="suit">${c.s}</span>`;const card=(c,small=false)=>`<span class="card ${red(c.s)?'red':''} ${small?'small':''}">${cardFace(c)}</span>`;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function message(s){$('error').textContent=s;setTimeout(()=>{if($('error').textContent===s)$('error').textContent='';},4500)}function enter(type){const name=$('name').value.trim(),code=$('room').value.trim().toUpperCase();if(!name)return message('יש להזין שם');if(type==='join'&&identity?.code===code&&identity?.name===name&&identity?.token){return reconnect();}socket.emit(type,{name,code},res=>{if(res.error)return message(res.error);identity={name,code:res.code,token:res.token};saveIdentity();$('entry').hidden=true;$('game').hidden=false;history.replaceState(null,'','#'+res.code);});}
$('create').onclick=()=>enter('create');$('join').onclick=()=>enter('join');if(location.hash)$('room').value=location.hash.slice(1).toUpperCase();if(identity){$('name').value=identity.name||'';$('room').value=identity.code||$('room').value;}socket.on('errorMessage',message);function reconnect(){if(!identity?.code||!identity?.token)return; if(!socket.connected){message('ממתינים לחיבור לשרת');return;}socket.emit('rejoin',identity,res=>{if(res.error){message(res.error);$('entry').hidden=false;$('game').hidden=true;if(res.error.includes('אינם תקינים')){identity=null;saveIdentity();}}else{$('entry').hidden=true;$('game').hidden=false;}});}socket.on('connect',reconnect);socket.on('replaced',msg=>{message(msg);state=null;$('entry').hidden=false;$('game').hidden=true;identity=null;saveIdentity();});socket.on('state',s=>{state=s;render();});function render(){const s=state;if(!s)return;$('code').textContent=s.code;$('round').textContent=s.round?`סיבוב ${s.round} מתוך 13`:'ממתינים לשחקנים';$('trump').innerHTML=s.round?(s.trump?`שליט: <span class="trump-symbol ${red(s.trump)?'red':'black'}">${s.trump}</span>`:'ללא שליט'):'';const phases={lobby:'ממתינים לארבעה שחקנים',bid:'שלב ההכרזות',play:'משחקים קלפים',trick:'הלקיחה הוכרעה',summary:'הסיבוב הסתיים',finished:'המשחק הסתיים'};$('status').textContent=s.paused?'המשחק מושהה — ממתינים לחידוש על ידי פותח החדר':phases[s.phase]||'';const my=s.seat;for(let pos=0;pos<4;pos++){const seat=(my+4-pos)%4,p=s.players[seat],el=$('seat'+pos);el.classList.toggle('active',s.turn===seat&&['bid','play'].includes(s.phase));const playedCard=s.table.find(x=>x.seat===seat);el.innerHTML=p?`<b>${esc(p.name)} ${seat===my?'(אתה)':''}</b><div class="seat-card">${playedCard?card(playedCard.card):'<span class="empty-card">ממתין לקלף</span>'}</div><div class="seat-info"><span class="player-stats"><span>הכרזה: <strong>${p.bid??'—'}</strong></span><span>לקיחות: <strong>${p.tricks}</strong></span></span><span class="player-detail">${p.connected?'מחובר':'מנותק'} · ${p.count} קלפים</span></div>`:'מקום פנוי';}const lobby=$('lobby');lobby.innerHTML='';if(s.phase==='lobby'){lobby.textContent=`הצטרפו ${s.players.length} מתוך 4 שחקנים. שתף את קוד החדר או את כתובת הדף.`;if(s.isHost&&s.players.length===4){const b=document.createElement('button');b.textContent='הגרל מקומות והתחל';b.onclick=()=>socket.emit('start');lobby.append(b);}}$('hand').innerHTML='';s.hand.map((c,i)=>({...c,originalIndex:i})).sort((a,b)=>'♠♥♦♣'.indexOf(a.s)-'♠♥♦♣'.indexOf(b.s)||b.r-a.r).forEach(c=>{const i=c.originalIndex;const b=document.createElement('button');b.className='card'+(red(c.s)?' red':'');b.innerHTML=cardFace(c);b.setAttribute('aria-label',cardText(c));const lead=s.table[0]?.card.s;const legal=!lead||c.s===lead||!s.hand.some(x=>x.s===lead);b.disabled=s.paused||s.phase!=='play'||s.turn!==my||!legal;b.onclick=()=>socket.emit('play',i);$('hand').append(b);});const a=$('actions');a.innerHTML='';if(s.paused){a.textContent='המשחק מושהה. ניתן לסגור את הדפדפן ולחזור עם אותו מכשיר.';}else if(s.phase==='bid'){if(s.turn===my){const p=document.createElement('p');p.textContent='תורך להכריז כמה לקיחות תיקח:';a.append(p);const wrap=document.createElement('div');wrap.className='row';for(let n=0;n<=s.round;n++){const forbidden=s.round>=5&&my===(s.first+3)%4&&s.players.reduce((sum,p)=>sum+(p.bid??0),0)+n===s.round;const b=document.createElement('button');b.textContent=n;b.disabled=forbidden;b.title=forbidden?'אסור שסכום ההכרזות יהיה שווה למספר הקלפים':'';b.onclick=()=>socket.emit('bid',n);wrap.append(b);}a.append(wrap);}else a.textContent='ממתינים להכרזה של '+s.players[s.turn].name;}if(!s.paused&&s.phase==='play')a.textContent=s.turn===my?'תורך: בחר קלף מהיד שלך':'תורו של '+s.players[s.turn].name;if(!s.paused&&s.phase==='trick'){const p=document.createElement('p');p.textContent='הלקיחה של '+s.players[s.leader].name+' — אישרו שראיתם את ארבעת הקלפים ('+s.seen.length+'/4)';a.append(p);const b=document.createElement('button');b.textContent=s.seen.includes(my)?'אישרת שראית ✓':'ראיתי';b.disabled=s.seen.includes(my);b.onclick=()=>socket.emit('seen');a.append(b);}if(!s.paused&&(s.phase==='summary'||s.phase==='finished')){const title=document.createElement('p');title.textContent=s.phase==='finished'?(s.endedEarly?'המשחק הסתיים ביוזמת פותח החדר':'המשחק הושלם!'):'הסיבוב הושלם — הניקוד עודכן';a.append(title);if(s.phase==='summary'&&s.isHost){const b=document.createElement('button');b.textContent='התחל סיבוב הבא';b.onclick=()=>socket.emit('next');a.append(b);}else if(s.phase==='summary')a.append(' ממתינים למנהל החדר להמשך.');}if(s.phase==='finished'){const newButton=document.createElement('button');newButton.textContent='פתח משחק חדש';newButton.onclick=()=>{socket.emit('leaveFinished');identity=null;saveIdentity();state=null;$('entry').hidden=false;$('game').hidden=true;$('room').value='';history.replaceState(null,'',location.pathname+location.search);message('אפשר לפתוח חדר חדש או להצטרף לחדר חדש.');};a.append(newButton);const hint=document.createElement('p');hint.className='muted';hint.textContent='למשחק חדש יש לפתוח חדר חדש ולשלוח לשחקנים את הקוד החדש.';a.append(hint);} if(s.isHost&&s.phase!=='finished'){const controls=document.createElement('div');controls.className='row';controls.style.marginTop='12px';if(s.paused){const b=document.createElement('button');b.textContent='המשך משחק';b.onclick=()=>socket.emit('resume');controls.append(b);}else if(s.phase!=='lobby'){const b=document.createElement('button');b.className='secondary';b.textContent='השהה משחק';b.onclick=()=>{if(confirm('להשהות את המשחק לכל המשתתפים?'))socket.emit('pause');};controls.append(b);}const end=document.createElement('button');end.className='secondary';end.textContent=s.phase==='lobby'?'בטל חדר':'סיים משחק';end.onclick=()=>{if(confirm(s.phase==='lobby'?'לבטל את החדר? כל המשתתפים יוכלו לפתוח או להצטרף לחדר חדש.':'לסיים את המשחק לצמיתות ולהציג את הניקוד?'))socket.emit('endGame');};controls.append(end);a.append(controls);}const rows=[...s.players].sort((a,b)=>b.score-a.score);$('scores').innerHTML='<table><thead><tr><th>שחקן</th><th>הכרזה</th><th>לקיחות</th><th>סה״כ נקודות</th></tr></thead><tbody>'+rows.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.bid??'—'}</td><td>${p.tricks}</td><td><b>${p.score}</b></td></tr>`).join('')+'</tbody></table>';}
window.addEventListener('beforeunload',e=>{if(state&&state.phase!=='finished'){e.preventDefault();e.returnValue='';}});</script><script>
(function () {
  const isTest = window.location.hostname === 'mini-bridge-test.onrender.com';
  const title = isTest ? "מיני ברידג' - דבי בדיקות" : "מיני ברידג' - דבי אופקים";
  document.title = title;
  document.getElementById('gameTitle').textContent = '♠ ' + title + ' ♥';
})();
</script></body></html>
